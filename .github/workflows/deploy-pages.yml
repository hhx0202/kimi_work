name: Deploy to Cloudflare Pages

# push 到 master 时自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只把网站真正需要的 5 个东西放进 dist，
      # 避免把 tests/ tools/ sql/ .git/ .workbuddy/ 一起发布出去
      - name: 准备发布目录
        run: |
          mkdir -p dist
          cp -r index.html intro.html css js assets dist/
          echo "文件数: $(find dist -type f | wc -l)"
          echo "体积: $(du -sh dist | cut -f1)"

      # 诊断：确认 secret 真的传进来了、token 真的有效、account id 是什么
      - name: 诊断密钥
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "API_TOKEN 长度: ${#T}"
          echo "ACCOUNT_ID 值: [$A]"
          echo "--- token 自检（Cloudflare 官方 verify 接口）---"
          curl -s --max-time 15 -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $T"
          echo ""

      # 不用 wrangler-action：它内部 npx 失败时只报 "exit code 1"，
      # 直接跑命令能让 wrangler 的真实报错完整出现在日志里。
      # wrangler 认环境变量里的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，无需 login。
      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name kimi-work --branch master
