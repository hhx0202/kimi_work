name: Deploy to Cloudflare Pages

# push 到 master 时自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只把网站真正需要的 5 个东西放进 dist，
      # 避免把 tests/ tools/ sql/ .git/ .workbuddy/ 一起发布出去
      - name: 准备发布目录
        run: |
          mkdir -p dist
          cp -r index.html intro.html css js assets dist/
          echo "文件数: $(find dist -type f | wc -l)"
          echo "体积: $(du -sh dist | cut -f1)"

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kimi-work --branch master
