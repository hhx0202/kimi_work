name: Deploy to Cloudflare Pages

# push 到 master 时自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只把网站真正需要的 5 个东西放进 dist，
      # 避免把 tests/ tools/ sql/ .git/ .workbuddy/ 一起发布出去
      - name: 准备发布目录
        run: |
          mkdir -p dist
          cp -r index.html intro.html css js assets dist/
          echo "文件数: $(find dist -type f | wc -l)"
          echo "体积: $(du -sh dist | cut -f1)"

      # 诊断：token 能访问哪些账号（真实 account id 会打印出来；
      # 如果它显示成 *** 说明 Secret 里的值是对的，显示明文说明 Secret 值填错了）
      - name: 诊断密钥
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "API_TOKEN 长度: ${#T}"
          echo "--- token 自检 ---"
          curl -s --max-time 15 -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $T"
          echo ""
          echo "--- 该 token 能访问的账号（真实 id）---"
          curl -s --max-time 15 -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $T"
          echo ""
          echo "--- Secret 里填的 account id 长度: ${#A} ---"

      # 必须显式传 CLOUDFLARE_ACCOUNT_ID：
      # 该 token 只有 Pages 操作权限、没有"列账号"权限，wrangler 自动检测账号会失败
      # （/accounts 返回空数组）。直传 account id 就绕开了那一步。
      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name kimi-work --branch master
