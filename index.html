<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>佑佑的任务岛</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
</head>
<body>
  <!-- 主应用（JS 动态渲染） -->
  <div id="app">
    <div class="loading-screen">
      <div class="loading-ball"></div>
      <p>正在加载任务岛...</p>
    </div>
  </div>

  <!-- 全屏动画遮罩（捕捉/进化/升级动画） -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 最早的错误监听：必须排在任何外部脚本之前，否则 CDN 脚本自身报错时没人接得到。
       只暂存到内存，app.js 加载后取走并按正常流程留档/上报。
       useCapture=true 才能收到"资源加载失败"（script/link 的 error 不冒泡）。 -->
  <script>
    window.__earlyErrors = [];
    window.addEventListener('error', function (e) {
      try {
        var t = e && e.target;
        var isRes = t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK');
        if (!e.message && !isRes) return;
        window.__earlyErrors.push({
          message: e.message || ('资源加载失败: ' + (t.src || t.href || '')),
          filename: e.filename || '', lineno: e.lineno || 0, colno: e.colno || 0,
          at: Date.now(), res: !!isRes
        });
        if (window.__earlyErrors.length > 20) window.__earlyErrors.shift();
      } catch (err) {}
    }, true);
  </script>

  <!-- crossorigin：CDN 脚本报错时浏览器才会给出真实错误信息（否则只有 "Script error."） -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pokemon-data.js"></script>
  <script src="js/pokemon-types.js"></script>
  <script src="js/poke-icons.js"></script>
  <script src="js/pokemon-flavor.js"></script>
  <script src="js/pokemon-moves.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
