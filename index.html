<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>佑佑的任务岛</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
</head>
<body>
  <!-- 主应用（JS 动态渲染） -->
  <div id="app">
    <div class="loading-screen">
      <div class="loading-ball"></div>
      <p>正在加载任务岛...</p>
    </div>
  </div>

  <!-- 全屏动画遮罩（捕捉/进化/升级动画） -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 最早的错误监听：必须排在任何外部脚本之前，否则 CDN 脚本自身报错时没人接得到。
       只暂存到内存，app.js 加载后取走并按正常流程留档/上报。
       useCapture=true 才能收到"资源加载失败"（script/link 的 error 不冒泡）。 -->
  <script>
    window.__earlyErrors = [];
    // app.js 启动后会接管（并把这里暂存的取走）；之后不再往这里写，
    // 否则同一条错误既进"早期错误"又进日志，下次看现场信息时会误以为是两次。
    window.addEventListener('error', function (e) {
      try {
        if (window.__kmAppReady) return;
        var t = e && e.target;
        var isRes = t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK');
        if (!e.message && !isRes) return;
        window.__earlyErrors.push({
          message: e.message || ('资源加载失败: ' + (t.src || t.href || '')),
          filename: e.filename || '', lineno: e.lineno || 0, colno: e.colno || 0,
          at: Date.now(), res: !!isRes
        });
        if (window.__earlyErrors.length > 20) window.__earlyErrors.shift();
      } catch (err) {}
    }, true);
  </script>

  <!-- 第三方库一律本地自带（js/vendor/）：以前走 cdn.jsdelivr.net，国内网络 / EdgeOne 等国内 CDN
       经常取不到，页面就会直接报「supabase is not defined」启动失败。
       升级版本时把新文件覆盖到 js/vendor/，并把这里的 ?v= 一起改掉（破 CDN 缓存），不要改回外链。 -->
  <script src="js/vendor/supabase.js?v=2.118.0"></script>
  <script src="js/vendor/confetti.min.js?v=1.9.3"></script>
  <script src="js/vendor/html2canvas.min.js?v=1.4.1"></script>
  <script src="js/config.js"></script>
  <script src="js/pokemon-data.js"></script>
  <script src="js/pokemon-types.js"></script>
  <script src="js/poke-icons.js"></script>
  <script src="js/pokemon-flavor.js"></script>
  <script src="js/pokemon-moves.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
